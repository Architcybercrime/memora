[project]
name = "memora-backend"
version = "0.1.0"
description = "Long-term memory AI agent backend."
requires-python = ">=3.10"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    # Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    # LangGraph + LangChain
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.8",
    "langchain-anthropic>=0.2.4",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.4",
    # Memory: Redis + pgvector
    "redis[hiredis]>=5.1.1",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    "sqlalchemy[asyncio]>=2.0.36",
    # Voice
    "faster-whisper>=1.0.3",
    # Utility
    "numpy>=1.26.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# B008: FastAPI dependency injection (`File(...)`, `Depends(...)`) is the documented pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
